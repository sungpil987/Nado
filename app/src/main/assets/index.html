<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#faf6f1"><title>냥도쿠</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="round back" id="backBtn" aria-label="이전 레벨">‹</button>
      <div class="heading"><div class="eyebrow">냥도쿠</div><h1>레벨 <span id="level">1</span></h1></div>
      <button class="round settings" id="settingsBtn" aria-label="설정">⚙</button>
    </header>
    <section class="progress"><div class="cat-chip"><img src="cat.png" alt="냥도쿠 고양이"><span id="mood">오늘도 한 판!</span></div><div class="score"><span>점수</span><b id="score">0</b></div></section>
    <section class="rules" aria-label="게임 규칙"><div><b>1</b><span>한 행에<br>고양이 한 마리</span></div><div><b>2</b><span>한 열에<br>고양이 한 마리</span></div><div><b>3</b><span>같은 색 칸<br>한 마리만</span></div><div><b>4</b><span>고양이는<br>서로 이웃 금지</span></div></section>
    <section class="game-area">
      <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="냥도쿠 퍼즐"></div></div>
      <div class="caption"><span class="dot"></span><span id="caption">빈칸은 한 번, 고양이는 빠르게 두 번 눌러 표시해</span></div>
    </section>
    <section class="actions">
      <button class="action" id="undoBtn"><span>↶</span><small>지우기</small></button>
      <button class="action hint" id="hintBtn"><span>💡</span><small>힌트 <b id="hints">2</b></small></button>
      <button class="action" id="newBtn"><span>↻</span><small>다시하기</small></button>
    </section>
    <footer><span id="levelInfo">4 × 4 · 고양이 4마리</span><button id="nextBtn" class="next" disabled>다음 레벨 <span>→</span></button></footer>
    <div class="toast" id="toast" role="status"></div>
    <div class="modal hidden" id="modal"><div class="dialog"><img src="cat.png" alt=""><h2 id="modalTitle">참 잘했어!</h2><p id="modalText"></p><button id="modalButton">계속하기</button></div></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
