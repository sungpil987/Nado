<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#faf6f1"><title>냥도쿠</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="round back" id="backBtn" aria-label="이전 레벨">‹</button>
      <div class="heading"><div class="eyebrow">냥도쿠</div><h1 id="screenHeading">레벨 1</h1></div>
      <button class="round daily-launch" id="dailyBtn" aria-label="데일리 챌린지">🏆</button>
      <button class="round settings" id="settingsBtn" aria-label="설정">⚙</button>
    </header>
    <section class="progress"><div class="cat-chip"><img src="cat.png" alt="냥도쿠 고양이"><span id="mood">오늘도 한 판!</span></div><div class="score"><span>점수</span><b id="score">0</b><div class="hearts" id="hearts" aria-label="실수 기회 3회">♥ ♥ ♥</div></div></section>
    <section class="rules" aria-label="게임 규칙"><div><b>1</b><span>한 행에<br>고양이 한 마리</span></div><div><b>2</b><span>한 열에<br>고양이 한 마리</span></div><div><b>3</b><span>같은 색 칸<br>한 마리만</span></div><div><b>4</b><span>고양이는<br>서로 이웃 금지</span></div></section>
    <section class="game-area">
      <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="냥도쿠 퍼즐"></div></div>
      <div class="caption"><span class="dot"></span><span id="caption">빈칸은 한 번, 고양이는 빠르게 두 번 눌러 표시해</span></div>
    </section>
    <section class="actions">
      <button class="action" id="undoBtn"><span>↶</span><small>지우기</small></button>
      <button class="action hint" id="hintBtn"><span>💡</span><small>힌트 <b id="hints">2</b></small></button>
      <button class="action" id="newBtn"><span>↻</span><small>다시하기</small></button>
    </section>
    <footer><span id="levelInfo">4 × 4 · 고양이 4마리</span><button id="nextBtn" class="next" disabled>다음 레벨 <span>→</span></button></footer>
    <div class="toast" id="toast" role="status"></div>
    <div class="modal hidden" id="modal"><div class="dialog"><img src="cat.png" alt=""><h2 id="modalTitle">참 잘했어!</h2><p id="modalText"></p><button id="modalButton">계속하기</button></div></div>
  </main>
  <section class="daily-screen hidden" id="dailyScreen" aria-label="데일리 챌린지">
    <div class="daily-hero">
      <header class="daily-header"><button class="daily-icon" id="dailyBack" aria-label="게임으로 돌아가기">‹</button><h2>데일리 챌린지</h2><button class="daily-icon" id="dailyInfo" aria-label="챌린지 안내">ⓘ</button><button class="daily-icon cup-small" id="monthlyTrophyBtn" aria-label="월간 트로피 안내"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 7h20v9c0 8-4 13-10 14-6-1-10-6-10-14V7Zm0 4H6v5c0 7 4 11 11 12m17-17h8v5c0 7-4 11-11 12M24 30v7m-8 4h16m-20 0h24"/></svg></button></header>
      <div class="daily-summary">
        <div class="daily-month"><div id="dailyYear">2026</div><div class="month-line"><button id="prevMonth" aria-label="이전 달">‹</button><strong id="dailyMonthTitle">11월</strong><button id="nextMonth" aria-label="다음 달">›</button></div><div class="month-count"><span class="medal-icon" aria-hidden="true">★</span><span id="monthlyCount">0/30</span></div></div>
        <div class="trophy-display" aria-label="월간 트로피"><svg viewBox="0 0 180 190" role="img" aria-label="트로피"><defs><linearGradient id="cupGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a1"/><stop offset=".38" stop-color="#f3bf4f"/><stop offset=".72" stop-color="#d88b27"/><stop offset="1" stop-color="#ffdb73"/></linearGradient><linearGradient id="cupBase" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c4b25"/><stop offset=".5" stop-color="#c78336"/><stop offset="1" stop-color="#77421e"/></linearGradient></defs><path class="cup-handles" d="M39 37H17v17c0 23 13 37 34 39m90-56h22v17c0 23-13 37-34 39"/><path class="cup-body" d="M38 24h104v34c0 37-20 59-52 64-32-5-52-27-52-64V24Z"/><path class="cup-shine" d="M51 35v25c0 18 6 31 18 40"/><path class="cup-stem" d="M77 121h26v23H77z"/><path class="cup-base" d="M62 144h56l9 16H53zM43 161h94v13H43z"/><path class="cup-star" d="m90 43 7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/></svg></div>
      </div>
      <div class="trophy-progress"><div class="progress-line"><div class="progress-fill" id="trophyFill"></div></div><div class="milestone bronze"><span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 7h22v9c0 9-5 15-11 15S13 25 13 16V7ZM13 11H6v5c0 7 4 11 12 12m17-17h7v5c0 7-4 11-12 12M24 31v7m-9 3h18M12 41h24"/></svg></span><b>10</b></div><div class="milestone silver"><span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 7h22v9c0 9-5 15-11 15S13 25 13 16V7ZM13 11H6v5c0 7 4 11 12 12m17-17h7v5c0 7-4 11-12 12M24 31v7m-9 3h18M12 41h24"/></svg></span><b>20</b></div><div class="milestone gold"><span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 7h22v9c0 9-5 15-11 15S13 25 13 16V7ZM13 11H6v5c0 7 4 11 12 12m17-17h7v5c0 7-4 11-12 12M24 31v7m-9 3h18M12 41h24"/></svg></span><b>30</b></div></div>
    </div>
    <div class="daily-calendar-wrap">
      <div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="daily-start-panel"><div id="dailySelectedLabel">11/14/26</div><div class="daily-difficulty" id="dailyDifficulty">오늘의 난이도 · 새싹</div><button id="dailyContinue">계속하기</button></div>
    </div>
    <div class="daily-info-toast" id="dailyInfoToast"></div>
  </section>
  <script src="game.js"></script>
</body>
</html>
